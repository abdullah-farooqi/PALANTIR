# PALANTIR — process grouping for apps.plugin.
#
# THIS FILE MUST EXIST AS A REAL FILE, NOT A SYMLINK. apps.plugin opens it with
# O_NOFOLLOW; a symlink fails with ELOOP ("Too many levels of symbolic links")
# and the plugin exits 1. When that happens every app.* context silently
# disappears from the API with no error — the queries just return 0 rows.
#
# Format:  <group name>: <process name> <process name> ...
# Matching is on the process/executable name (comm), and patterns may end in '*'
# for a prefix match. A process matching several lines joins every matching
# group.

# ── PALANTIR stack ───────────────────────────────────────────────────────────
# Do NOT add a bare "python3" rule: it matches every Python process on the host,
# including unrelated tooling, and collapses them into one palantir metric.
palantir-backend: uvicorn
palantir-worker: celery
palantir-beat: celery

# ── Data layer ───────────────────────────────────────────────────────────────
postgres: postgres
redis: redis-server

# ── Platform ─────────────────────────────────────────────────────────────────
docker: dockerd containerd containerd-shim-runc-v2
ssh: sshd