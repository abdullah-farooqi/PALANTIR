# services/netdata/health.d/palantir.conf
# [VERIFIED] The calc: line is mandatory. Without it, $this silently becomes the sum of all lookup: dimensions — raw bytes, not a percentage — firing CRITICAL permanently on every device.

alarm: palantir_high_cpu
    on: system.cpu
lookup: average -1m unaligned of user,system
  calc: $user + $system
 units: %
 every: 10s
  warn: $this > (($status >= $WARNING)  ? (75) : (85))
  crit: $this > (($status == $CRITICAL) ? (90) : (95))
  info: CPU utilisation on this node

alarm: palantir_high_memory
    on: system.ram
lookup: average -1m unaligned of used,free,cached,buffers
  calc: 100 * $used / ($used + $free + $cached + $buffers)
 units: %
 every: 10s
  warn: $this > (($status >= $WARNING)  ? (80) : (90))
  crit: $this > (($status == $CRITICAL) ? (92) : (97))
  info: Memory utilisation on this node

# template fires once per interface automatically
template: palantir_net_drops
      on: net.drops
  lookup: sum -1m unaligned absolute
    calc: $inbound + $outbound
   units: packets/s
   every: 30s
    warn: $this > 10
    crit: $this > 100
    info: Packet drops on ${label:device}

template: palantir_net_errors
      on: net.errors
  lookup: sum -1m unaligned absolute
    calc: $inbound + $outbound
   units: packets/s
   every: 30s
    warn: $this > 5
    crit: $this > 50
    info: Network errors on ${label:device}
