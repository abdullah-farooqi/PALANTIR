# PALANTIR Netdata Health Alarm Notify Configuration
SEND_CUSTOM="YES"
DEFAULT_RECIPIENT_CUSTOM="palantir"
CUSTOM_RECIPIENT="${PALANTIR_WEBHOOK_URL:-http://backend:8000/internal/alert}"
PALANTIR_SECRET="${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}"

custom_sender() {
    # alarm-notify.sh sets global variables: ${host}, ${name}, ${chart}, ${status}, ${value}, ${units}, etc.
    # Fallback to positional arguments if called directly:
    local _host="${host:-${2:-$(hostname)}}"
    local _alert="${name:-${alarm:-${4:-unknown}}}"
    local _chart="${chart:-${3:-unknown}}"
    local _status="${status:-${1:-WARNING}}"
    local _value="${value:-${5:-0}}"
    local _units="${units:-${6:-}}"
    local _now="${when:-$(date +%s)}"

    # Ensure value is numeric for JSON
    case "${_value}" in
        ''|*[!0-9.-]*) _value=0 ;;
    esac

    local json_payload="{\"node\":\"${_host}\",\"alert\":\"${_alert}\",\"chart\":\"${_chart}\",\"status\":\"${_status}\",\"value\":${_value},\"units\":\"${_units}\",\"timestamp\":${_now}}"
    local -a ca_args=()
    if [ -n "${PALANTIR_CA_CERT:-}" ]; then
        ca_args=(--cacert "${PALANTIR_CA_CERT}")
    fi

    if command -v curl >/dev/null 2>&1; then
        curl "${ca_args[@]}" -s -X POST "${CUSTOM_RECIPIENT}" \
            -H "Content-Type: application/json" \
            -H "X-PALANTIR-Secret: ${PALANTIR_SECRET}" \
            -d "${json_payload}" >/dev/null 2>&1
    elif command -v wget >/dev/null 2>&1; then
        local wget_ca_args=()
        if [ -n "${PALANTIR_CA_CERT:-}" ]; then
            wget_ca_args=(--ca-certificate="${PALANTIR_CA_CERT}")
        fi
        wget -q -O- "${wget_ca_args[@]}" \
            --header="Content-Type: application/json" \
            --header="X-PALANTIR-Secret: ${PALANTIR_SECRET}" \
            --post-data="${json_payload}" \
            "${CUSTOM_RECIPIENT}" >/dev/null 2>&1
    fi
    return 0
}
