# PALANTIR Netdata Health Alarm Notify Configuration
SEND_CUSTOM=YES
CUSTOM_RECIPIENT="${PALANTIR_WEBHOOK_URL:-http://palantir-backend:8000/internal/alert}"

custom_sender() {
    local status="${1}"
    local hostname="${2}"
    local chart="${3}"
    local alarm="${4}"
    local value="${5}"
    local units="${6}"

    curl -s -X POST "${CUSTOM_RECIPIENT}" \
      -H "Content-Type: application/json" \
      -H "X-PALANTIR-Secret: ${PALANTIR_WEBHOOK_SECRET}" \
      -d "{
        \"node\":      \"${hostname}\",
        \"alert\":     \"${alarm}\",
        \"chart\":     \"${chart}\",
        \"status\":    \"${status}\",
        \"value\":     ${value:-0},
        \"units\":     \"${units}\",
        \"timestamp\": $(date +%s)
      }"
}
