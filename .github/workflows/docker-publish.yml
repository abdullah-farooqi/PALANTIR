name: Build & Publish Docker Images

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag version (e.g. 1.0.0 or latest)"
        required: true
        default: "latest"
      push_ghcr:
        description: "Publish to GitHub Container Registry (ghcr.io)"
        type: boolean
        required: true
        default: true
      push_dockerhub:
        description: "Publish to Docker Hub"
        type: boolean
        required: true
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-images:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Authenticate Registries ──────────────────────────────────
      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'workflow_dispatch' || inputs.push_ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: (github.event_name != 'workflow_dispatch' || inputs.push_dockerhub) && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      # ── Determine Tags ───────────────────────────────────────────
      - name: Set Image Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${{ github.ref }}" =~ ^refs/tags/v ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
          else
            TAG="latest"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ── Build & Push Backend Image ───────────────────────────────
      - name: Build and Push palantir-backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ (github.event_name != 'workflow_dispatch' || inputs.push_ghcr) && format('ghcr.io/{0}/palantir-backend:{1}', github.repository_owner, steps.vars.outputs.tag) || '' }}
            ${{ (github.event_name != 'workflow_dispatch' || inputs.push_ghcr) && format('ghcr.io/{0}/palantir-backend:latest', github.repository_owner) || '' }}
            ${{ (env.DOCKERHUB_USERNAME != '' && (github.event_name != 'workflow_dispatch' || inputs.push_dockerhub)) && format('{0}/palantir-backend:{1}', env.DOCKERHUB_USERNAME, steps.vars.outputs.tag) || '' }}
            ${{ (env.DOCKERHUB_USERNAME != '' && (github.event_name != 'workflow_dispatch' || inputs.push_dockerhub)) && format('{0}/palantir-backend:latest', env.DOCKERHUB_USERNAME) || '' }}

      # ── Build & Push Netdata Sensor Image ────────────────────────
      - name: Build and Push palantir-netdata
        uses: docker/build-push-action@v5
        with:
          context: ./services/netdata
          file: ./services/netdata/Dockerfile
          push: true
          tags: |
            ${{ (github.event_name != 'workflow_dispatch' || inputs.push_ghcr) && format('ghcr.io/{0}/palantir-netdata:{1}', github.repository_owner, steps.vars.outputs.tag) || '' }}
            ${{ (github.event_name != 'workflow_dispatch' || inputs.push_ghcr) && format('ghcr.io/{0}/palantir-netdata:latest', github.repository_owner) || '' }}
            ${{ (env.DOCKERHUB_USERNAME != '' && (github.event_name != 'workflow_dispatch' || inputs.push_dockerhub)) && format('{0}/palantir-netdata:{1}', env.DOCKERHUB_USERNAME, steps.vars.outputs.tag) || '' }}
            ${{ (env.DOCKERHUB_USERNAME != '' && (github.event_name != 'workflow_dispatch' || inputs.push_dockerhub)) && format('{0}/palantir-netdata:latest', env.DOCKERHUB_USERNAME) || '' }}
