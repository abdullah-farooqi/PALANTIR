name: PALANTIR CD Pipeline

on:
  workflow_run:
    workflows: ["PALANTIR CI Pipeline"]
    types:
      - completed
    branches:
      - main
      - initial_project
      - telemetry_pipeline
      - telemetry_pipeline_with_frontend
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish_registries:
        description: "Publish images to Docker Hub and GHCR"
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish-images:
    name: Publish Production Images to Registries
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download smoke-tested images artifact (from CI)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: palantir-images-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Load or Build Images
        id: image-prep
        run: |
          set -euo pipefail
          if [ -f palantir-images.tar ]; then
            echo "Loading smoke-tested images from CI artifact..."
            docker load --input palantir-images.tar
          else
            echo "Artifact not present or direct trigger. Building fresh images with Buildx..."
            docker build -t abdullahahmadfarooqi/palantir-backend:latest ./backend
            docker build -t palantir-host-collector:latest ./agent
          fi

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: abdullahahmadfarooqi
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Publish Multi-Registry Images
        env:
          PUSH_REF: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}
          COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        run: |
          set -euo pipefail

          clean_ref="${PUSH_REF#refs/heads/}"
          clean_ref="${clean_ref#refs/tags/}"

          if [[ "$clean_ref" =~ ^v[0-9]+ ]]; then
            version="${clean_ref#v}"
            suffixes=(latest "$version" "sha-${COMMIT_SHA:0:7}")
          else
            suffixes=(latest "$clean_ref" "sha-${COMMIT_SHA:0:7}")
          fi

          echo "Target tags to publish: ${suffixes[*]}"

          for image in backend collector; do
            case "$image" in
              backend)
                docker_name=palantir-backend
                source_image=abdullahahmadfarooqi/palantir-backend:latest
                ;;
              collector)
                docker_name=palantir-host-collector
                source_image=palantir-host-collector:latest
                ;;
            esac

            for suffix in "${suffixes[@]}"; do
              # Publish to GHCR
              ghcr_image="ghcr.io/abdullah-farooqi/${docker_name}:${suffix}"
              docker tag "$source_image" "$ghcr_image"
              docker push "$ghcr_image"
              echo "Published: $ghcr_image"

              # Publish to Docker Hub if token configured
              if [ "$HAS_DOCKERHUB" = "true" ]; then
                dh_image="abdullahahmadfarooqi/${docker_name}:${suffix}"
                docker tag "$source_image" "$dh_image"
                docker push "$dh_image"
                echo "Published: $dh_image"
              fi
            done
          done

  create-release:
    name: Create GitHub Release on Tag
    runs-on: ubuntu-latest
    needs: publish-images
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "PALANTIR Release ${{ github.ref_name }}" \
            --generate-notes \
            --verify-tag
