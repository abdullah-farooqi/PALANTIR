name: PALANTIR CI Pipeline

on:
  push:
    branches: [ "main", "initial_project", "telemetry_pipeline", "telemetry_pipeline_with_frontend" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "initial_project", "telemetry_pipeline", "telemetry_pipeline_with_frontend" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Backend Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: palantir
          POSTGRES_PASSWORD: palantir
          POSTGRES_DB: palantir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=palantir psql -h localhost -U palantir -d palantir -f sql/init.sql

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          pytest -v

  agent-tests:
    name: Host Collector Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install host collector and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pytest

      - name: Run host collector tests
        run: pytest -q agent/tests

  frontend-build:
    name: Frontend Build & Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

  docker-smoke-test:
    name: Docker Stack Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, agent-tests, frontend-build]
    permissions:
      contents: read
    # Disposable credentials for the throwaway Compose stack.
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-20261005
      PALANTIR_WEBHOOK_SECRET: ci-webhook-secret-0123456789abcdef0123456789abcdef
      PALANTIR_API_READ_TOKEN: ci-read-token-0123456789abcdef0123456789abcdef
      PALANTIR_API_ADMIN_TOKEN: ci-admin-token-0123456789abcdef0123456789abcdef
      PALANTIR_API_ENROLL_TOKEN: ci-enroll-token-0123456789abcdef0123456789abcdef
      AGENT_AUTH_TOKEN: ci-agent-token-0123456789abcdef0123456789abcdef
      AUTHENTIK_SECRET_KEY: ci-only-authentik-secret-key-0123456789abcdef0123456789abcdef
      AUTHENTIK_POSTGRES_PASSWORD: ci-only-authentik-postgres-password-20261005

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Build Docker Stack
        run: docker compose build

      - name: Build host collector image
        run: docker build -t palantir-host-collector:latest ./agent

      - name: Start Docker Stack in Background
        run: docker compose up -d

      - name: Verify PostgreSQL Initialization
        run: |
          echo "Waiting for postgres to become healthy..."
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready -U palantir -d palantir; do sleep 2; done'
          docker compose exec -T postgres psql -U palantir -d palantir -c "\dt"

      - name: Verify Backend /healthz Endpoint
        run: |
          echo "Testing live backend endpoint..."
          timeout 60s bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 2; done'
          echo ""

      - name: Verify Webhook Authentication
        run: |
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/internal/alert \
            -H "Content-Type: application/json" \
            -H "X-PALANTIR-Secret: invalid-key" \
            -d '{"node":"test","alert":"test","status":"CRITICAL"}')
          if [ "$STATUS_CODE" -ne 403 ]; then
            echo "Expected HTTP 403 but got $STATUS_CODE"
            exit 1
          fi
          echo "Webhook authentication rejection verified (HTTP 403)."

      - name: Run Full Pytest Suite in Live Stack
        run: |
          docker compose exec -T backend pytest tests/ -v

      - name: Save smoke-tested images for CD delivery
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/telemetry_pipeline' || github.ref == 'refs/heads/telemetry_pipeline_with_frontend' || github.ref == 'refs/heads/initial_project' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker save --output palantir-images.tar \
            abdullahahmadfarooqi/palantir-backend:latest \
            palantir-host-collector:latest

      - name: Upload smoke-tested images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/telemetry_pipeline' || github.ref == 'refs/heads/telemetry_pipeline_with_frontend' || github.ref == 'refs/heads/initial_project' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: palantir-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: palantir-images.tar
          if-no-files-found: error
          retention-days: 1

      - name: Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Clean Up Containers
        if: always()
        run: docker compose down -v
