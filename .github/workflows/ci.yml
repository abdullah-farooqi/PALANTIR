name: PALANTIR CI/CD Pipeline

on:
  push:
    branches: [ "main", "initial_project" , "telemetry_pipeline" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "initial_project" ,  "telemetry_pipeline" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: palantir
          POSTGRES_PASSWORD: palantir
          POSTGRES_DB: palantir
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize Database Schema
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          PGPASSWORD=palantir psql -h localhost -U palantir -d palantir -f sql/init.sql

      - name: Run Pytest Test Suite
        working-directory: backend
        run: |
          pytest -v

  docker-smoke-test:
    name: Docker Stack Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [unit-tests, agent-tests]
    permissions:
      contents: read
    # Disposable credentials for the throwaway Compose stack. These override
    # the intentionally blank values in .env.example and are not production secrets.
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password-20261005
      PALANTIR_WEBHOOK_SECRET: ci-webhook-secret-0123456789abcdef0123456789abcdef
      PALANTIR_API_READ_TOKEN: ci-read-token-0123456789abcdef0123456789abcdef
      PALANTIR_API_ADMIN_TOKEN: ci-admin-token-0123456789abcdef0123456789abcdef
      PALANTIR_API_ENROLL_TOKEN: ci-enroll-token-0123456789abcdef0123456789abcdef
      AGENT_AUTH_TOKEN: ci-agent-token-0123456789abcdef0123456789abcdef
      AUTHENTIK_SECRET_KEY: ci-only-authentik-secret-key-0123456789abcdef0123456789abcdef
      AUTHENTIK_POSTGRES_PASSWORD: ci-only-authentik-postgres-password-20261005

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare Environment File
        run: cp .env.example .env

      - name: Build Docker Stack
        run: docker compose build

      - name: Build host collector image
        run: docker build -t palantir-host-collector:latest ./agent

      - name: Start Docker Stack in Background
        run: docker compose up -d

      - name: Verify PostgreSQL Initialization
        run: |
          echo "Waiting for postgres to become healthy..."
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready -U palantir -d palantir; do sleep 2; done'
          docker compose exec -T postgres psql -U palantir -d palantir -c "\dt"

      - name: Verify Backend /healthz Endpoint
        run: |
          echo "Testing live backend endpoint..."
          timeout 60s bash -c 'until curl -sf http://localhost:8000/healthz; do sleep 2; done'
          echo ""

      - name: Verify Webhook Authentication
        run: |
          # Test invalid secret rejection (HTTP 403)
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/internal/alert \
            -H "Content-Type: application/json" \
            -H "X-PALANTIR-Secret: invalid-key" \
            -d '{"node":"test","alert":"test","status":"CRITICAL"}')
          if [ "$STATUS_CODE" -ne 403 ]; then
            echo "Expected HTTP 403 but got $STATUS_CODE"
            exit 1
          fi
          echo "Webhook authentication rejection verified (HTTP 403)."

      - name: Run Full Pytest Suite in Live Stack
        run: |
          docker compose exec -T backend pytest tests/ -v

      - name: Save smoke-tested images for publishing
        if: github.event_name == 'push' && (github.ref == 'refs/heads/telemetry_pipeline' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          docker save --output palantir-images.tar \
            abdullahahmadfarooqi/palantir-backend:latest \
            abdullahahmadfarooqi/palantir-netdata:latest \
            palantir-host-collector:latest

      - name: Upload smoke-tested images
        if: github.event_name == 'push' && (github.ref == 'refs/heads/telemetry_pipeline' || startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: palantir-images-${{ github.run_id }}-${{ github.run_attempt }}
          path: palantir-images.tar
          if-no-files-found: error
          retention-days: 1

      - name: Container Logs on Failure
        if: failure()
        run: |
          docker compose logs

      - name: Clean Up Containers
        if: always()
        run: docker compose down -v

  agent-tests:
    name: Host Collector Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: agent/requirements.txt

      - name: Install host collector and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt pytest

      - name: Run host collector tests
        run: pytest -q agent/tests

  publish-images:
    name: Publish smoke-tested images
    runs-on: ubuntu-latest
    needs: docker-smoke-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/telemetry_pipeline' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download smoke-tested images
        uses: actions/download-artifact@v4
        with:
          name: palantir-images-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Load smoke-tested images
        run: docker load --input palantir-images.tar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: abdullahahmadfarooqi
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish smoke-tested images
        env:
          PUSH_REF: ${{ github.ref }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$PUSH_REF" == "refs/heads/telemetry_pipeline" ]]; then
            suffixes=(latest telemetry_pipeline "sha-${COMMIT_SHA}")
          elif [[ "$PUSH_REF" == refs/tags/v* ]]; then
            version="${PUSH_REF#refs/tags/v}"
            [[ "$version" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
              echo "Release tag has an invalid Docker tag suffix." >&2
              exit 1
            }
            suffixes=(latest "$version" "sha-${COMMIT_SHA}")
          else
            echo "Unsupported image publish ref: ${PUSH_REF}" >&2
            exit 1
          fi

          for image in backend netdata collector; do
            case "$image" in
              backend)
                docker_name=palantir-backend
                source_image=abdullahahmadfarooqi/palantir-backend:latest
                ;;
              netdata)
                docker_name=palantir-netdata
                source_image=abdullahahmadfarooqi/palantir-netdata:latest
                ;;
              collector)
                docker_name=palantir-host-collector
                source_image=palantir-host-collector:latest
                ;;
            esac
            for suffix in "${suffixes[@]}"; do
              for target_image in "abdullahahmadfarooqi/${docker_name}" "ghcr.io/abdullah-farooqi/${docker_name}"; do
                docker tag "$source_image" "${target_image}:${suffix}"
                docker push "${target_image}:${suffix}"
              done
            done
          done
