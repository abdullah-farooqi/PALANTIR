services:
  postgres:
    image: postgres:16-alpine
    container_name: palantir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palantir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-palantir}
      POSTGRES_DB: ${POSTGRES_DB:-palantir}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palantir -d palantir"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: palantir-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  netdata:
    build:
      context: ./services/netdata
      dockerfile: Dockerfile
    image: palantir-netdata:latest
    container_name: palantir-netdata
    hostname: local-node
    restart: unless-stopped
    pid: host
    ports:
      - "19999:19999"
    cap_add:
      - SYS_PTRACE
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    volumes:
      - ./services/netdata/health_alarm_notify.conf:/usr/local/etc/netdata/health_alarm_notify.conf:ro
      - ./services/netdata/health.d/palantir.conf:/usr/local/etc/netdata/health.d/palantir.conf:ro
      - netdata_lib:/usr/local/var/lib/netdata
      - netdata_cache:/usr/local/var/cache/netdata
    environment:
      - PALANTIR_WEBHOOK_URL=http://backend:8000/internal/alert
      - PALANTIR_WEBHOOK_SECRET=${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:19999/api/v1/info"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    image: ${PALANTIR_BACKEND_IMAGE:-palantir-backend:latest}
    container_name: palantir-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      netdata:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://redis:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    image: ${PALANTIR_BACKEND_IMAGE:-palantir-backend:latest}
    container_name: palantir-celery-worker
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      netdata:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://redis:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    image: ${PALANTIR_BACKEND_IMAGE:-palantir-backend:latest}
    container_name: palantir-celery-beat
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      netdata:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://redis:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}

volumes:
  postgres_data:
  redis_data:
  netdata_lib:
  netdata_cache:
