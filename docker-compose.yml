services:
  postgres:
    image: postgres:16-alpine
    container_name: palantir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palantir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-palantir}
      POSTGRES_DB: ${POSTGRES_DB:-palantir}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palantir -d palantir"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: palantir-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: palantir-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://redis:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: palantir-celery-worker
    restart: unless-stopped
    command: celery -A workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://redis:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: palantir-celery-beat
    restart: unless-stopped
    command: celery -A workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:-palantir}@postgres:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://redis:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:-palantir-super-secret-key-change-me}

volumes:
  postgres_data:
  redis_data:
