services:
  postgres:
    image: postgres:16-alpine
    container_name: palantir-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-palantir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-palantir}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-palantir} -d ${POSTGRES_DB:-palantir}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: palantir-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5



  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${PALANTIR_BACKEND_IMAGE:-abdullahahmadfarooqi/palantir-backend:latest}
    container_name: palantir-backend
    restart: unless-stopped
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://127.0.0.1:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:?Set PALANTIR_WEBHOOK_SECRET in .env}
      PALANTIR_API_READ_TOKEN: ${PALANTIR_API_READ_TOKEN:-}
      PALANTIR_API_ADMIN_TOKEN: ${PALANTIR_API_ADMIN_TOKEN:-}
      PALANTIR_API_ENROLL_TOKEN: ${PALANTIR_API_ENROLL_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:?Set AGENT_AUTH_TOKEN in .env; it must match PALANTIR_AGENT_TOKEN on each remote host}
      METRICS_RETENTION_HOURS: ${METRICS_RETENTION_HOURS:-24}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}
      NODE_REACHABLE_SECONDS: ${NODE_REACHABLE_SECONDS:-180}
      NODE_STALE_SECONDS: ${NODE_STALE_SECONDS:-900}
      METRIC_STALE_SECONDS: ${METRIC_STALE_SECONDS:-180}
      WORKER_HEARTBEAT_STALE_SECONDS: ${WORKER_HEARTBEAT_STALE_SECONDS:-180}
    ports:
      - "127.0.0.1:8000:8000"

  authentik-postgres:
    image: postgres:16-alpine
    container_name: palantir-authentik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Set AUTHENTIK_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: authentik
    volumes:
      - authentik_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U authentik -d authentik"]
      interval: 5s
      timeout: 5s
      retries: 10

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    container_name: palantir-authentik-server
    command: server
    restart: unless-stopped
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Set AUTHENTIK_POSTGRES_PASSWORD in .env}
      AUTHENTIK_WEB__BASE_URL: https://auth.palantir.home.arpa
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.8.3}
    container_name: palantir-authentik-worker
    command: worker
    restart: unless-stopped
    depends_on:
      authentik-postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY:?Set AUTHENTIK_SECRET_KEY in .env}
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgres
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRES_PASSWORD:?Set AUTHENTIK_POSTGRES_PASSWORD in .env}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - authentik_media:/media
      - authentik_templates:/templates

  caddy:
    image: caddy:2-alpine
    container_name: palantir-caddy
    restart: unless-stopped
    depends_on:
      - backend
      - authentik-server
    environment:
      PALANTIR_API_READ_TOKEN: ${PALANTIR_API_READ_TOKEN:?Set PALANTIR_API_READ_TOKEN in .env}
      PALANTIR_API_ADMIN_TOKEN: ${PALANTIR_API_ADMIN_TOKEN:?Set PALANTIR_API_ADMIN_TOKEN in .env}
      PALANTIR_API_ENROLL_TOKEN: ${PALANTIR_API_ENROLL_TOKEN:-}
    ports:
      # Set PALANTIR_LAN_BIND_IP to the server's static LAN address in .env.
      # The loopback default keeps the proxy private until that is configured.
      - "${PALANTIR_LAN_BIND_IP:-127.0.0.1}:80:80"
      - "${PALANTIR_LAN_BIND_IP:-127.0.0.1}:443:443"
      - "${PALANTIR_LAN_BIND_IP:-127.0.0.1}:443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${PALANTIR_BACKEND_IMAGE:-abdullahahmadfarooqi/palantir-backend:latest}
    container_name: palantir-celery-worker
    restart: unless-stopped
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app.celery_app worker --loglevel=info
    depends_on:
      backend:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://127.0.0.1:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:?Set PALANTIR_WEBHOOK_SECRET in .env}
      AGENT_AUTH_TOKEN: ${AGENT_AUTH_TOKEN:?Set AGENT_AUTH_TOKEN in .env; it must match PALANTIR_AGENT_TOKEN on each remote host}
      METRICS_RETENTION_HOURS: ${METRICS_RETENTION_HOURS:-24}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-7}

  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${PALANTIR_BACKEND_IMAGE:-abdullahahmadfarooqi/palantir-backend:latest}
    container_name: palantir-celery-beat
    restart: unless-stopped
    network_mode: "host"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: celery -A workers.celery_app.celery_app beat --loglevel=info
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-palantir}
      SYNC_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-palantir}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@127.0.0.1:5432/${POSTGRES_DB:-palantir}
      REDIS_URL: redis://127.0.0.1:6379/0
      PALANTIR_WEBHOOK_SECRET: ${PALANTIR_WEBHOOK_SECRET:?Set PALANTIR_WEBHOOK_SECRET in .env}

volumes:
  postgres_data:
  redis_data:
  netdata_lib:
  netdata_cache:
  authentik_postgres_data:
  authentik_media:
  authentik_templates:
  caddy_data:
  caddy_config:
